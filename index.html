
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071522">
<meta name="description" content="SENTINEL Personal Intelligence Assistant">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>SENTINEL</title>

<style>
* { box-sizing: border-box; }

:root {
  --bg: #061321;
  --border: #17364c;
  --cyan: #38d9ff;
  --text: #e8f5ff;
  --muted: #7894a9;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  background: radial-gradient(ellipse at top, #102d49, var(--bg) 65%);
  color: var(--text);
  font-family: Arial, sans-serif;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

header {
  flex: 0 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 4%;
  border-bottom: 1px solid var(--border);
}

.logo {
  font-size: 21px;
  font-weight: bold;
  letter-spacing: 5px;
  color: var(--cyan);
}

.status {
  color: #58e6a5;
  font-size: 12px;
}

main {
  flex: 1;
  min-height: 0;
  width: 100%;
  max-width: 1500px;
  margin: 0 auto;
  padding: 14px 24px;
  display: flex;
  flex-direction: column;
}

.panel {
  background: #0b1e30dd;
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 18px;
  box-shadow: 0 12px 35px #0004;
}

.panel-title {
  flex: 0 0 auto;
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--cyan);
  margin-bottom: 10px;
}

#chatPanel {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 15px 22px;
}

#chatPanel.hidden {
  display: none;
}

#messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 12px 5%;
  scrollbar-width: thin;
  scrollbar-color: #1b6685 transparent;
}

#messages::-webkit-scrollbar {
  width: 7px;
}

#messages::-webkit-scrollbar-track {
  background: transparent;
}

#messages::-webkit-scrollbar-thumb {
  background: #1b6685;
  border-radius: 10px;
}

.message {
  max-width: 90%;
  padding: 15px 19px;
  border-radius: 14px;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 15px;
  flex: 0 0 auto;
}

.sentinel {
  align-self: flex-start;
  background: #102c43;
  border: 1px solid #1a526d;
  border-top-left-radius: 5px;
  max-width: 95%;
}

.user {
  align-self: flex-end;
  background: #07577a;
  border: 1px solid #168bb6;
  border-top-right-radius: 5px;
  max-width: 85%;
}

.input-area {
  flex: 0 0 auto;
  display: flex;
  gap: 10px;
  margin-top: 13px;
  padding-top: 12px;
  border-top: 1px solid #17364c;
}

input {
  min-width: 0;
  flex: 1;
  padding: 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: #061321;
  color: white;
  outline: none;
  font-size: 14px;
}

input:focus {
  border-color: var(--cyan);
}

button {
  padding: 0 25px;
  border: 0;
  border-radius: 10px;
  background: var(--cyan);
  color: #041522;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.access {
  max-width: 420px;
  width: 100%;
  margin: 15px auto;
}

.access input {
  width: 100%;
  margin: 8px 0 12px;
}

.access button {
  width: 100%;
  padding: 14px;
}

.hidden {
  display: none !important;
}

#chatStatus {
  flex: 0 0 auto;
  margin-bottom: 0;
  padding-top: 5px;
}

.subtitle {
  color: var(--muted);
  font-size: 11px;
  margin-top: 5px;
}

.notification-area {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 5px;
}

#notificationButton {
  padding: 9px 14px;
  font-size: 10px;
  letter-spacing: 1px;
}

#notificationStatus {
  margin: 0;
  font-size: 10px;
}

footer {
  flex: 0 0 auto;
  text-align: center;
  color: #55748b;
  font-size: 10px;
  padding: 7px;
}

@media(max-width: 600px) {
  html, body {
    height: 100%;
    height: 100dvh;
  }

  header {
    padding: 12px 17px;
  }

  main {
    padding: 9px;
  }

  #chatPanel {
    padding: 12px;
  }

  #messages {
    padding: 10px 2px;
    gap: 13px;
  }

  .message {
    max-width: 96%;
    padding: 12px 14px;
    font-size: 14px;
  }

  .input-area {
    gap: 7px;
  }

  input {
    padding: 13px;
  }

  button {
    padding: 0 15px;
  }

  footer {
    padding: 6px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">SENTINEL</div>
  <div class="status">● SYSTEM ONLINE</div>
</header>

<main>

  <section id="accessPanel" class="panel access">
    <div class="panel-title">AUTHENTICATION REQUIRED</div>
    <p>Enter your private SENTINEL access code.</p>
    <input id="accessCode" type="password" placeholder="Access code" autocomplete="off">
    <button id="connectButton">CONNECT</button>
    <p id="accessStatus" class="subtitle"></p>
  </section>

  <section id="chatPanel" class="panel hidden">
    <div class="panel-title">SECURE AI COMMUNICATION</div>

    <div class="notification-area">
      <button id="notificationButton">ENABLE NOTIFICATIONS</button>
      <p id="notificationStatus" class="subtitle">
        PHONE NOTIFICATIONS NOT ENABLED
      </p>
    </div>

    <div id="messages">
      <div class="message sentinel">
        SENTINEL online. Cloud AI connection ready. How may I assist?
      </div>
    </div>

    <div class="input-area">
      <input id="messageInput" type="text" placeholder="Message SENTINEL..." autocomplete="off">
      <button id="sendButton">SEND</button>
    </div>

    <p id="chatStatus" class="subtitle">CONNECTED TO CLOUD AI</p>
  </section>

</main>

<footer>
  SENTINEL v1.3.0 · PERSONAL INTELLIGENCE SYSTEM
</footer>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging-compat.js"></script>

<script>
const API_URL =
  "https://sentinel-connection.logancoburn07.workers.dev/";

const firebaseConfig = {
  apiKey: "AIzaSyAK-UHKbYrhiprRLQyV7sTMgDPUn6NfFC8",
  authDomain: "sentinel-61705.firebaseapp.com",
  projectId: "sentinel-61705",
  storageBucket: "sentinel-61705.firebasestorage.app",
  messagingSenderId: "398524596354",
  appId: "1:398524596354:web:04e6e4ec2d7b23c632749b"
};

const VAPID_KEY =
  "BE4dV1np_7vVy8yfMOr5g4izItEkqeGrQR3NjPdFzYnsndT6jXFC9BAw9JtcFpHKOGU4Tj-Qq-hdK58WO2BVNpQ";

let accessCode = "";
let messaging = null;
let firebaseReady = false;
let serviceWorkerRegistration = null;

const accessPanel = document.getElementById("accessPanel");
const chatPanel = document.getElementById("chatPanel");
const accessStatus = document.getElementById("accessStatus");
const chatStatus = document.getElementById("chatStatus");
const messageInput = document.getElementById("messageInput");
const messages = document.getElementById("messages");
const sendButton = document.getElementById("sendButton");
const notificationButton = document.getElementById("notificationButton");
const notificationStatus = document.getElementById("notificationStatus");

try {
  firebase.initializeApp(firebaseConfig);
  messaging = firebase.messaging();
  firebaseReady = true;

  messaging.onMessage(payload => {
    const title = payload.notification?.title || "SENTINEL";
    const body = payload.notification?.body || "You have a new update.";

    addMessage("NOTIFICATION\n" + title + "\n" + body, "sentinel");
  });
} catch (error) {
  console.error("Firebase initialisation failed:", error);
}

function addMessage(content, type) {
  const element = document.createElement("div");
  element.className = "message " + type;
  element.textContent = content;
  messages.appendChild(element);
  messages.scrollTop = messages.scrollHeight;
}

async function apiRequest(payload) {
  const response = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const data = await response.json();

  if (!response.ok || data.success === false) {
    throw new Error(data.error || "The server request failed.");
  }

  return data;
}

async function connect() {
  const code = document.getElementById("accessCode").value.trim();

  if (!code) {
    accessStatus.textContent = "Please enter your access code.";
    return;
  }

  const connectButton = document.getElementById("connectButton");
  connectButton.disabled = true;
  accessStatus.textContent = "Checking connection...";

  try {
    const data = await apiRequest({
      action: "chat",
      accessCode: code,
      message: "Reply with exactly: SENTINEL connection verified."
    });

    accessCode = code;
    sessionStorage.setItem("sentinelAccessCode", code);

    accessPanel.classList.add("hidden");
    chatPanel.classList.remove("hidden");

    addMessage(data.reply, "sentinel");
    messageInput.focus();

    await loadLatestBriefing();

    const savedToken = localStorage.getItem("sentinelFcmToken");

    if (savedToken) {
      notificationStatus.textContent = "DEVICE TOKEN SAVED ON THIS DEVICE";
      notificationButton.textContent = "NOTIFICATIONS SET UP";
    }

  } catch (error) {
    accessStatus.textContent = error.message;
  } finally {
    connectButton.disabled = false;
  }
}

async function sendMessage() {
  const message = messageInput.value.trim();

  if (!message || !accessCode || sendButton.disabled) return;

  addMessage(message, "user");
  messageInput.value = "";

  sendButton.disabled = true;
  chatStatus.textContent = "SENTINEL IS THINKING...";

  const loading = document.createElement("div");
  loading.className = "message sentinel";
  loading.textContent = "Processing request...";
  messages.appendChild(loading);
  messages.scrollTop = messages.scrollHeight;

  try {
    const data = await apiRequest({
      action: "chat",
      accessCode: accessCode,
      message: message
    });

    loading.remove();

    addMessage(data.reply, "sentinel");
    chatStatus.textContent = "CONNECTED TO CLOUD AI";

  } catch (error) {
    loading.remove();
    addMessage("Connection error: " + error.message, "sentinel");
    chatStatus.textContent = "CONNECTION ERROR";
  }

  sendButton.disabled = false;
  messageInput.focus();
}

async function loadLatestBriefing() {
  if (!accessCode) return;

  try {
    const data = await apiRequest({
      action: "get_latest_briefing",
      accessCode: accessCode
    });

    const briefing =
      data.briefing ||
      data.summary ||
      data.latestBriefing ||
      "";

    const briefingDate = data.date || "";

    if (briefing) {
      addMessage(
        "LATEST EMAIL BRIEFING" +
        (briefingDate ? "\n" + briefingDate : "") +
        "\n\n" + briefing,
        "sentinel"
      );
    }

  } catch (error) {
    console.warn("Could not retrieve the latest briefing:", error);
  }
}

async function enableNotifications() {
  if (!accessCode) {
    notificationStatus.textContent = "CONNECT TO SENTINEL FIRST";
    return;
  }

  if (!firebaseReady) {
    notificationStatus.textContent = "FIREBASE COULD NOT INITIALISE";
    return;
  }

  if (!("Notification" in window) || !("serviceWorker" in navigator)) {
    notificationStatus.textContent = "NOTIFICATIONS NOT SUPPORTED";
    return;
  }

  notificationButton.disabled = true;
  notificationStatus.textContent = "SETTING UP NOTIFICATIONS...";

  try {
    const permission = await Notification.requestPermission();

    if (permission !== "granted") {
      throw new Error("Notification permission was not granted.");
    }

    serviceWorkerRegistration =
      await navigator.serviceWorker.register("./sw.js");

    await navigator.serviceWorker.ready;

    const token = await messaging.getToken({
      vapidKey: VAPID_KEY,
      serviceWorkerRegistration: serviceWorkerRegistration
    });

    if (!token) {
      throw new Error("Firebase did not return a device token.");
    }

    const result = await apiRequest({
      action: "register_device",
      accessCode: accessCode,
      token: token
    });

    if (result.success === false) {
      throw new Error(result.error || "The server could not save the device.");
    }

    localStorage.setItem("sentinelFcmToken", token);

    notificationStatus.textContent = "DEVICE REGISTERED — NOTIFICATIONS READY";
    notificationButton.textContent = "NOTIFICATIONS ENABLED";

  } catch (error) {
    console.error("Notification setup error:", error);
    notificationStatus.textContent = error.message;
    notificationButton.disabled = false;
  }
}

document.getElementById("connectButton")
  .addEventListener("click", connect);

sendButton.addEventListener("click", sendMessage);

notificationButton.addEventListener("click", enableNotifications);

document.getElementById("accessCode")
  .addEventListener("keydown", event => {
    if (event.key === "Enter") connect();
  });

messageInput.addEventListener("keydown", event => {
  if (event.key === "Enter") sendMessage();
});

const savedCode = sessionStorage.getItem("sentinelAccessCode");

if (savedCode) {
  document.getElementById("accessCode").value = savedCode;
  connect();
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      serviceWorkerRegistration =
        await navigator.serviceWorker.register("./sw.js");
    } catch (error) {
      console.log("Offline support unavailable:", error);
    }
  });
}
</script>

</body>
</html>
