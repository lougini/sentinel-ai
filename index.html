// ============================================

let accessCode = "";
let messaging = null;
let firebaseReady = false;
let serviceWorkerRegistration = null;

let voiceMode = false;
let recognition = null;
let recognitionActive = false;
let recognitionRestartTimer = null;

let isSpeaking = false;
let isProcessing = false;
let currentUtterance = null;
let speechSequence = 0;
let availableVoices = [];
let selectedVoice = null;

const accessPanel = document.getElementById("accessPanel");
const chatPanel = document.getElementById("chatPanel");
const accessStatus = document.getElementById("accessStatus");
const chatStatus = document.getElementById("chatStatus");

const messageInput = document.getElementById("messageInput");
const messages = document.getElementById("messages");
const sendButton = document.getElementById("sendButton");

const notificationButton = document.getElementById("notificationButton");
const notificationStatus = document.getElementById("notificationStatus");

const voiceButton = document.getElementById("voiceButton");
const interruptButton = document.getElementById("interruptButton");
const voiceStatus = document.getElementById("voiceStatus");

// ============================================

try {

// ============================================
// GENERAL UTILITIES
// ============================================

function addMessage(content, type) {
  const element = document.createElement("div");
  element.className = "message " + type;
  element.textContent = content;

  messages.appendChild(element);
  messages.scrollTop = messages.scrollHeight;
}

async function apiRequest(payload) {
  const response = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const data = await response.json();

  if (!response.ok || data.success === false) {
    throw new Error(data.error || "The server request failed.");
  }

  return data;
}


// ============================================
// CONNECTION
// ============================================

async function connect() {

  if (!code) {

}


// ============================================
// VOICE SELECTION
// ============================================

/*
  Browser voice metadata is inconsistent.
  Most browsers do not expose a reliable gender field.

  This selector:
  1. Prefers Australian English.
  2. Prefers voices whose names suggest a masculine voice.
  3. Falls back to other English voices.
  4. Finally uses the browser's default voice.
*/

function scoreVoice(voice) {
  const name = String(voice.name || "").toLowerCase();
  const lang = String(voice.lang || "").toLowerCase();

  let score = 0;

  if (lang === "en-au") score += 100;
  else if (lang.startsWith("en-au")) score += 90;
  else if (lang === "en-gb") score += 65;
  else if (lang.startsWith("en-gb")) score += 60;
  else if (lang === "en-us") score += 50;
  else if (lang.startsWith("en")) score += 35;
  else score -= 100;

  const masculineClues = [
    "male",
    "daniel",
    "oliver",
    "arthur",
    "george",
    "james",
    "thomas",
    "david",
    "alex",
    "ryan",
    "guy"
  ];

  const feminineClues = [
    "female",
    "samantha",
    "victoria",
    "karen",
    "moira",
    "tessa",
    "serena",
    "zira"
  ];

  if (masculineClues.some(word => name.includes(word))) {
    score += 25;
  }

  if (feminineClues.some(word => name.includes(word))) {
    score -= 35;
  }

  if (voice.default) score += 3;

  return score;
}

function refreshVoices() {
  if (!("speechSynthesis" in window)) return;

  availableVoices = window.speechSynthesis.getVoices();

  if (!availableVoices.length) {
    selectedVoice = null;
    return;
  }

  const englishVoices = availableVoices.filter(voice =>
    String(voice.lang || "").toLowerCase().startsWith("en")
  );

  if (!englishVoices.length) {
    selectedVoice = null;
    return;
  }

  englishVoices.sort((a, b) => scoreVoice(b) - scoreVoice(a));

  selectedVoice = englishVoices[0];

  console.log(
    "SENTINEL selected voice:",
    selectedVoice.name,
    selectedVoice.lang
  );
}

if ("speechSynthesis" in window) {
  refreshVoices();

  window.speechSynthesis.addEventListener(
    "voiceschanged",
    refreshVoices
  );
}


// ============================================
// VOICE STATUS
// ============================================

function setVoiceStatus(message, state = "") {
  voiceStatus.textContent = message;

  voiceStatus.classList.remove("listening", "speaking");

  if (state) {
    voiceStatus.classList.add(state);
  }
}


// ============================================
// SPEECH RECOGNITION
// ============================================

function createSpeechRecognition() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    throw new Error(
      "Speech recognition is not supported in this browser. Please use Google Chrome."
    );
  }

  recognition = new SpeechRecognition();

  recognition.lang = "en-AU";
  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    recognitionActive = true;

    if (voiceMode && !isSpeaking && !isProcessing) {
      setVoiceStatus(
        "LISTENING — SPEAK NATURALLY",
        "listening"
      );
    }
  };

  recognition.onresult = event => {
    let transcript = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {
      if (event.results[i].isFinal) {
        transcript += event.results[i][0].transcript;
      }
    }

    transcript = transcript.trim();

    if (
      transcript &&
      voiceMode &&
      !isSpeaking &&
      !isProcessing
    ) {
      isProcessing = true;
      stopRecognition();

      messageInput.value = transcript;

      sendMessage("voice");
    }
  };

  recognition.onerror = event => {
    console.warn("Voice recognition error:", event.error);

    if (
      event.error === "not-allowed" ||
      event.error === "service-not-allowed"
    ) {
      stopVoiceMode();
      setVoiceStatus("MICROPHONE PERMISSION DENIED");
      chatStatus.textContent =
        "ALLOW MICROPHONE ACCESS IN YOUR BROWSER";
      return;
    }

    if (event.error === "audio-capture") {
      setVoiceStatus("MICROPHONE NOT FOUND");
    } else if (event.error === "network") {
      setVoiceStatus("SPEECH SERVICE CONNECTION ERROR");
    } else if (event.error === "no-speech") {
      setVoiceStatus("LISTENING — SPEAK NATURALLY", "listening");
    }
  };

  recognition.onend = () => {
    recognitionActive = false;

    if (
      voiceMode &&
      !isSpeaking &&
      !isProcessing
    ) {
      clearTimeout(recognitionRestartTimer);

      recognitionRestartTimer = setTimeout(() => {
        startRecognition();
      }, 400);
    }
  };
}

function startRecognition() {
  if (
    !voiceMode ||
    isSpeaking ||
    isProcessing ||
    !recognition ||
    recognitionActive
  ) {
    return;
  }

  try {
    recognition.start();

  } catch (error) {
    console.warn(
      "Could not start recognition:",
      error.message
    );
  }
}

function stopRecognition() {
  clearTimeout(recognitionRestartTimer);
  recognitionRestartTimer = null;

  if (recognition && recognitionActive) {
    try {
      recognition.stop();

    } catch (error) {
      console.warn(
        "Could not stop recognition:",
        error.message
      );
    }
  }

  recognitionActive = false;
}


// ============================================
// VOICE MODE
// ============================================

function startVoiceMode() {
  if (voiceMode) return;

  try {
    if (!("speechSynthesis" in window)) {
      throw new Error(
        "Speech output is not supported in this browser."
      );
    }

    if (!recognition) {
      createSpeechRecognition();
    }

    refreshVoices();

    voiceMode = true;

    voiceButton.textContent = "STOP VOICE";
    interruptButton.disabled = true;

    chatStatus.textContent = "VOICE CONVERSATION ACTIVE";

    setVoiceStatus("STARTING MICROPHONE...");

    startRecognition();

  } catch (error) {
    setVoiceStatus(error.message);
    chatStatus.textContent = "VOICE MODE UNAVAILABLE";
  }
}

function stopVoiceMode() {
  voiceMode = false;
  isSpeaking = false;
  isProcessing = false;

  speechSequence++;

  stopRecognition();

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  currentUtterance = null;

  voiceButton.textContent = "START VOICE MODE";
  interruptButton.disabled = true;

  setVoiceStatus("VOICE MODE OFF");
  chatStatus.textContent = "CONNECTED TO CLOUD AI";
}


// ============================================
// NATURAL SPEECH OUTPUT
// ============================================

function getSpeechSettings(text) {
  const trimmed = String(text || "").trim();
  const isQuestion = /\?\s*$/.test(trimmed);

  return {
    rate: 0.96,
    pitch: isQuestion ? 0.96 : 0.88,
    volume: 1
  };
}

function speakResponse(text) {
  return new Promise(resolve => {
    if (
      !voiceMode ||
      !("speechSynthesis" in window)
    ) {
      resolve();
      return;
    }

    const sequence = ++speechSequence;

    isSpeaking = true;
    isProcessing = true;

    stopRecognition();

    window.speechSynthesis.cancel();

    // Allow the browser to finish cancelling earlier speech.
    const utterance = new SpeechSynthesisUtterance(
      String(text || "I'm sorry, I didn't receive a response.")
    );

    currentUtterance = utterance;

    utterance.lang = "en-AU";

    const settings = getSpeechSettings(text);

    utterance.rate = settings.rate;
    utterance.pitch = settings.pitch;
    utterance.volume = settings.volume;

    if (selectedVoice) {
      utterance.voice = selectedVoice;
    }

    interruptButton.disabled = false;

    setVoiceStatus(
      "SENTINEL IS SPEAKING...",
      "speaking"
    );

    chatStatus.textContent = "SENTINEL RESPONDING";

    let finished = false;

    const finishSpeaking = () => {
      if (finished) return;
      finished = true;

      if (sequence !== speechSequence) {
        resolve();
        return;
      }

      isSpeaking = false;
      isProcessing = false;
      currentUtterance = null;

      interruptButton.disabled = true;

      resolve();

      if (voiceMode) {
        setVoiceStatus(
          "RETURNING TO LISTENING..."
        );

        startRecognition();
      }
    };

    utterance.onend = finishSpeaking;
    utterance.onerror = finishSpeaking;

    try {
      window.speechSynthesis.speak(utterance);

    } catch (error) {
      console.error("Speech output failed:", error);
      finishSpeaking();
    }
  });
}


// ============================================
// INTERRUPT
// ============================================

function interruptSpeech() {
  if (!voiceMode || !isSpeaking) return;

  speechSequence++;

  window.speechSynthesis.cancel();

  currentUtterance = null;

  isSpeaking = false;
  isProcessing = false;

  interruptButton.disabled = true;

  setVoiceStatus(
    "INTERRUPTED — LISTENING",
    "listening"
  );

  startRecognition();
}


// ============================================
// CHAT MESSAGING
// ============================================

/*
  MESSAGE SOURCE:

  keyboard = display response only
  voice = display response and speak it

  Keyboard messages remain silent even when
  voice mode is active.
*/

async function sendMessage(source = "keyboard") {
  const message = messageInput.value.trim();

  if (
    !message ||
    !accessCode ||
    sendButton.disabled
  ) {
    if (voiceMode) {
      isProcessing = false;
      startRecognition();
    }

    return;
  }

  if (voiceMode) {
    isProcessing = true;
    stopRecognition();
  }

  addMessage(message, "user");

  messageInput.value = "";

  sendButton.disabled = true;

  chatStatus.textContent = "SENTINEL IS THINKING...";

  const loading = document.createElement("div");

  loading.className = "message sentinel";
  loading.textContent = "Processing request...";

  messages.appendChild(loading);
  messages.scrollTop = messages.scrollHeight;

  try {
    const data = await apiRequest({
      action: "chat",
      accessCode: accessCode,
      message: message
    });

    loading.remove();

    addMessage(data.reply, "sentinel");

    chatStatus.textContent = "CONNECTED TO CLOUD AI";

    if (source === "voice" && voiceMode) {
      await speakResponse(data.reply);

    } else if (voiceMode) {
      isProcessing = false;

      setVoiceStatus(
        "LISTENING AGAIN...",
        "listening"
      );

      startRecognition();
    }

  } catch (error) {
    loading.remove();

    addMessage(
      "Connection error: " + error.message,
      "sentinel"
    );

    chatStatus.textContent = "CONNECTION ERROR";

    if (voiceMode) {
      isProcessing = false;

      setVoiceStatus(
        "LISTENING AGAIN...",
        "listening"
      );

      startRecognition();
    }

  } finally {
    sendButton.disabled = false;
  }
}


// ============================================
// EMAIL BRIEFING
// ============================================

async function loadLatestBriefing() {
  if (!accessCode) return;

  try {
    const data = await apiRequest({
      action: "get_latest_briefing",
      accessCode: accessCode
    });

    const briefing =
      data.briefing ||
      data.summary ||
      data.latestBriefing ||
      "";

    const briefingDate = data.date || "";

    if (briefing) {
      addMessage(
        "LATEST EMAIL BRIEFING" +
        (briefingDate ? "\n" + briefingDate : "") +
        "\n\n" + briefing,
        "sentinel"
      );
    }

  } catch (error) {
    console.warn(
      "Could not retrieve the latest briefing:",
      error
    );
  }
}

// FIREBASE NOTIFICATIONS

async function enableNotifications() {
  if (!accessCode) {
    notificationStatus.textContent =
      "CONNECT TO SENTINEL FIRST";
    return;
  }

  if (!firebaseReady) {
    notificationStatus.textContent =
      "FIREBASE COULD NOT INITIALISE";
    return;
  }

  if (
    !("Notification" in window) ||
    !("serviceWorker" in navigator)
  ) {
    notificationStatus.textContent =
      "NOTIFICATIONS NOT SUPPORTED";
    return;
  }

  notificationButton.disabled = true;

  notificationStatus.textContent =
    "SETTING UP NOTIFICATIONS...";

  try {
    const permission =
      await Notification.requestPermission();

    if (permission !== "granted") {
      throw new Error(
        "Notification permission was not granted."
      );
    }

    serviceWorkerRegistration =
      await navigator.serviceWorker.register("./sw.js");

    await navigator.serviceWorker.ready;

    const token = await messaging.getToken({
      vapidKey: VAPID_KEY,
      serviceWorkerRegistration:
        serviceWorkerRegistration
    });

    if (!token) {
      throw new Error(
        "Firebase did not return a device token."
      );
    }

    const result = await apiRequest({
      action: "register_device",
      accessCode: accessCode,
      token: token
    });

    if (result.success === false) {
      throw new Error(
        result.error ||
        "The server could not save the device."
      );
    }

    localStorage.setItem(
      "sentinelFcmToken",
      token
    );

    notificationStatus.textContent =
      "DEVICE REGISTERED — NOTIFICATIONS READY";

    notificationButton.textContent =
      "NOTIFICATIONS ENABLED";

  } catch (error) {
    console.error(
      "Notification setup error:",
      error
    );

    notificationStatus.textContent =
      error.message;

    notificationButton.disabled = false;
  }
}


// ============================================
// EVENT LISTENERS
// ============================================

document.getElementById("connectButton")
  .addEventListener("click", connect);

sendButton.addEventListener("click", () => {
  sendMessage("keyboard");
});

textToggleButton.addEventListener("click", () => {
  const isHidden =
    inputArea.classList.contains("hidden");

  if (isHidden) {
    inputArea.classList.remove("hidden");

    textToggleButton.textContent =
      "CLOSE TEXT INPUT";

    messageInput.focus();

  } else {
    inputArea.classList.add("hidden");

    textToggleButton.textContent =
      "OPEN TEXT INPUT";

    messageInput.blur();
  }
});

notificationButton.addEventListener(
  "click",
  enableNotifications
);

voiceButton.addEventListener("click", () => {
  if (voiceMode) {
    stopVoiceMode();
  } else {
    startVoiceMode();
  }
});

interruptButton.addEventListener(
  "click",
  interruptSpeech
);

document.getElementById("accessCode")
  .addEventListener("keydown", event => {
    if (event.key === "Enter") {
      connect();
    }
  });

messageInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    sendMessage("keyboard");
  }
});


// ============================================
// SESSION RESTORATION
// ============================================

const savedCode =
  sessionStorage.getItem("sentinelAccessCode");

if (savedCode) {
  document.getElementById("accessCode").value =
    savedCode;

  connect();
}


// ============================================
// SERVICE WORKER
// ============================================

if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      serviceWorkerRegistration =
        await navigator.serviceWorker.register("./sw.js");

    } catch (error) {
      console.log(
        "Offline support unavailable:",
        error
      );
    }
  });
}

</script>

</body>
</html>
